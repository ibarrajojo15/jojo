<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Jerseys Barato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=Anton&display=swap">
<!-- Google <model-viewer> web component for real draggable 3D GLB jerseys -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
/* ============================================================
   JERSEYS BARATO — storefront mock-up
   Layout concept: a calm, Apple-clean canvas where the kit is the
   hero; sticky translucent nav; full-width product grids; a slide-in
   cart. One accent (pitch green) carries all energy; neutrals carry a
   faint green bias. Three deliberate skins: Light / Dark / Glass.
   ============================================================ */

/* ---- Design tokens: LIGHT (default) ---- */
:root{
  --bg:#f6f7f6;          /* near-white, faint green bias */
  --surface:#ffffff;
  --surface-2:#eef0ee;
  --card:#ffffff;
  --fg:#0d120f;          /* near-black */
  --fg-soft:#55605a;
  --fg-faint:#8b958f;
  --line:#e3e6e3;
  --accent:#009f58;      /* pitch green */
  --accent-ink:#ffffff;
  --accent-soft:rgba(0,159,88,.12);
  --sale:#e0352b;        /* semantic: sale/alert */
  --gold:#caa24a;
  --shadow:0 1px 2px rgba(13,18,15,.06), 0 12px 30px rgba(13,18,15,.08);
  --shadow-sm:0 1px 2px rgba(13,18,15,.08);
  --nav-bg:rgba(246,247,246,.72);
  --nav-blur:saturate(180%) blur(20px);
  --drawer-bg:#ffffff;
  --scrim:rgba(13,18,15,.42);
  --stage-grad:radial-gradient(120% 120% at 50% 0%, #ffffff 0%, #eef0ee 70%);
  --radius:18px;
  --radius-sm:12px;
  --maxw:1180px;
}
/* ---- DARK ---- */
:root[data-theme="dark"]{
  --bg:#0b0e0c;
  --surface:#141814;
  --surface-2:#1c221d;
  --card:#141814;
  --fg:#eef2ef;
  --fg-soft:#aab4ad;
  --fg-faint:#6f7a73;
  --line:#262d27;
  --accent:#19c56f;
  --accent-ink:#06130b;
  --accent-soft:rgba(25,197,111,.16);
  --sale:#ff5b50;
  --gold:#d9b969;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --nav-bg:rgba(11,14,12,.66);
  --nav-blur:saturate(180%) blur(20px);
  --drawer-bg:#141814;
  --scrim:rgba(0,0,0,.6);
  --stage-grad:radial-gradient(120% 120% at 50% 0%, #1b211c 0%, #0b0e0c 72%);
  color-scheme:dark;
}
/* ---- GLASS (glassmorphism over a living gradient) ---- */
:root[data-theme="glass"]{
  --bg:#0a1220;
  --surface:rgba(255,255,255,.08);
  --surface-2:rgba(255,255,255,.14);
  --card:rgba(255,255,255,.10);
  --fg:#f4f8ff;
  --fg-soft:#c6d2e6;
  --fg-faint:#90a0bd;
  --line:rgba(255,255,255,.18);
  --accent:#49f2a2;
  --accent-ink:#05231a;
  --accent-soft:rgba(73,242,162,.18);
  --sale:#ff7a6e;
  --gold:#ffd98a;
  --shadow:0 2px 10px rgba(0,0,0,.25), 0 24px 60px rgba(0,0,0,.35);
  --shadow-sm:0 1px 3px rgba(0,0,0,.25);
  --nav-bg:rgba(255,255,255,.10);
  --nav-blur:saturate(160%) blur(26px);
  --drawer-bg:rgba(20,30,48,.72);
  --scrim:rgba(4,8,16,.5);
  --stage-grad:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.03));
  color-scheme:dark;
}
:root[data-theme="glass"] body{
  background:
    radial-gradient(60% 50% at 12% 8%, #1f6feb55 0%, transparent 60%),
    radial-gradient(55% 45% at 88% 14%, #16c79a4d 0%, transparent 60%),
    radial-gradient(70% 60% at 50% 100%, #7b61ff40 0%, transparent 60%),
    #0a1220;
  background-attachment:fixed;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:"Manrope", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:"Outfit", ui-sans-serif, system-ui, sans-serif; margin:0; line-height:1.08; text-wrap:balance; letter-spacing:-.02em}
h1{font-weight:800}
h2{font-weight:700}
p{margin:0}
a{color:inherit}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.wrap{width:100%; max-width:var(--maxw); margin:0 auto;
  padding-left:max(18px, env(safe-area-inset-left,0px));
  padding-right:max(18px, env(safe-area-inset-right,0px));
}
.eyebrow{font-family:"Outfit"; text-transform:uppercase; letter-spacing:.16em; font-size:.72rem; font-weight:700; color:var(--accent)}
.muted{color:var(--fg-soft)}
.faint{color:var(--fg-faint)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  border:1px solid transparent; border-radius:999px; cursor:pointer;
  font-family:"Outfit"; font-weight:600; font-size:.95rem; padding:.7rem 1.25rem;
  background:var(--surface-2); color:var(--fg); transition:transform .12s ease, background .2s, opacity .2s;
  -webkit-tap-highlight-color:transparent;}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--accent); color:var(--accent-ink)}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--fg)}
.btn-block{width:100%}
.btn-sm{padding:.5rem .9rem; font-size:.85rem}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .dot:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ---------- Deal banner (always on, above nav) ---------- */
.deal{position:relative; z-index:60; width:100%; background:var(--accent); color:var(--accent-ink);
  border:0; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.6rem;
  padding:.55rem max(18px, env(safe-area-inset-left,0px));
  padding-top:calc(.55rem + env(safe-area-inset-top,0px));
  font-family:"Outfit"; font-weight:700; font-size:.9rem; letter-spacing:.01em; text-align:center;
  transition:filter .2s}
.deal:hover{filter:brightness(1.05)}
.deal .bolt{font-size:1rem}
.deal .chev{opacity:.85; font-weight:700}

/* ---------- Nav ---------- */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  background:var(--nav-bg); backdrop-filter:var(--nav-blur); -webkit-backdrop-filter:var(--nav-blur);
  border-bottom:1px solid var(--line)}
.nav-inner{display:flex; align-items:center; gap:1rem; height:62px}
.brand{display:flex; align-items:baseline; gap:.1rem; font-family:"Outfit"; font-weight:800; font-size:1.3rem;
  letter-spacing:-.03em; cursor:pointer; background:none; border:0; color:var(--fg); padding:0; white-space:nowrap}
.brand b{color:var(--accent); font-weight:800}
.nav-links{display:flex; gap:.25rem; margin-left:1rem; flex:1}
.nav-links button{background:none; border:0; color:var(--fg-soft); cursor:pointer; font-family:"Outfit";
  font-weight:600; font-size:.92rem; padding:.5rem .7rem; border-radius:10px; white-space:nowrap; transition:color .15s, background .15s}
.nav-links button:hover{color:var(--fg); background:var(--surface-2)}
.nav-links button.active{color:var(--accent)}
.nav-tools{display:flex; align-items:center; gap:.4rem}
.icon-btn{position:relative; width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--fg); cursor:pointer; display:grid; place-items:center; transition:transform .12s, background .2s}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn svg{width:20px; height:20px}
.lang-btn{display:flex; align-items:center; min-width:auto; width:auto; padding:0 .7rem; font-family:"Outfit"; font-weight:700; font-size:.82rem; letter-spacing:.04em; gap:.25rem}
.lang-btn .on{color:var(--accent)}
.cart-count{position:absolute; top:-6px; right:-6px; min-width:19px; height:19px; padding:0 4px; border-radius:999px;
  background:var(--sale); color:#fff; font-size:.68rem; font-weight:700; display:grid; place-items:center; font-family:"Outfit"}
.cart-count[data-empty="true"]{display:none}
.hamburger{display:none}

/* ---------- Views ---------- */
.view{padding-block:34px 60px; animation:fade .32s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none} *{scroll-behavior:auto!important}}

/* ---------- Hero ---------- */
.hero{display:grid; grid-template-columns:1.05fr 1fr; gap:34px; align-items:center}
.hero-copy h1{font-size:clamp(2.3rem,6vw,3.7rem)}
.hero-copy .lede{margin-top:1rem; font-size:1.08rem; color:var(--fg-soft); max-width:46ch}
.hero-cta{display:flex; gap:.7rem; margin-top:1.6rem; flex-wrap:wrap}
.hero-stats{display:flex; gap:1.6rem; margin-top:2rem; flex-wrap:wrap}
.hero-stats .s{display:flex; flex-direction:column}
.hero-stats .s b{font-family:"Outfit"; font-weight:800; font-size:1.4rem}
.hero-stats .s span{font-size:.8rem; color:var(--fg-faint); text-transform:uppercase; letter-spacing:.08em}

/* ---------- Jersey 3D stage ---------- */
.stage-wrap{display:flex; flex-direction:column; align-items:center; gap:14px}
.stage{width:min(330px,80vw); aspect-ratio:300/360; border-radius:26px; background:var(--stage-grad);
  border:1px solid var(--line); box-shadow:var(--shadow); position:relative; overflow:hidden;
  perspective:1300px; touch-action:none; cursor:grab; user-select:none}
.stage.dragging{cursor:grabbing}
.stage::after{content:""; position:absolute; left:14%; right:14%; bottom:7%; height:16px; border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.28), transparent); filter:blur(3px)}
.rot{position:absolute; inset:0; transform-style:preserve-3d; transform:rotateY(-18deg)}
.layer{position:absolute; inset:0; display:grid; place-items:center}
.layer svg{width:72%; height:auto; overflow:visible}
.layer.detail{backface-visibility:hidden}
.spin-hint{display:flex; align-items:center; gap:.5rem; font-family:"Outfit"; font-weight:600; font-size:.82rem; color:var(--fg-faint)}
.spin-hint svg{width:16px;height:16px}

/* ---------- Hero 3D model-viewer ---------- */
.model-stage{width:min(360px,82vw); aspect-ratio:300/360; border-radius:26px; background:var(--stage-grad);
  border:1px solid var(--line); box-shadow:var(--shadow); position:relative; overflow:hidden}
.hero-model{width:100%; height:100%; display:block; background:transparent; --poster-color:transparent;
  cursor:grab; touch-action:pan-y}
.hero-model:active{cursor:grabbing}
/* Fallback: a real jersey graphic sits behind the model so the hero is never
   empty. If the GLB (or the model-viewer CDN) can't load, the "unavailable"
   note is revealed too. Once a model loads, the whole fallback is hidden. */
.model-fallback{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; text-align:center; padding:18px; background:var(--stage-grad)}
.model-fallback svg{width:62%; height:auto; opacity:.95}
.mf-text{display:none; font-family:"Outfit"; font-weight:600; font-size:.82rem; color:var(--fg-faint); max-width:24ch}
.model-stage.model-ok .model-fallback{display:none}
.model-stage.model-failed .model-fallback{display:flex}
.model-stage.model-failed .mf-text{display:block}
.swatches{display:flex; gap:.6rem; align-items:center}
.dot{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0;
  position:relative; transition:transform .12s}
.dot:hover{transform:scale(1.08)}
.dot[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset}

/* ---------- Section heading ---------- */
.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin:0 0 20px}
.sec-head h2{font-size:clamp(1.5rem,3.4vw,2.1rem)}
.sec-head p{color:var(--fg-soft); margin-top:.3rem; max-width:52ch}
.section{margin-top:56px}

/* ---------- Category chips ---------- */
.chips{display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:22px}
.chip{border:1px solid var(--line); background:var(--surface); color:var(--fg-soft); border-radius:999px;
  padding:.5rem 1rem; font-family:"Outfit"; font-weight:600; font-size:.9rem; cursor:pointer; transition:all .18s}
.chip:hover{color:var(--fg)}
.chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

/* ---------- Product grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:20px}
.product{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  display:flex; flex-direction:column; box-shadow:var(--shadow-sm); transition:transform .15s, box-shadow .2s}
.product:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
.p-media{position:relative; aspect-ratio:1/1; display:grid; place-items:center; background:var(--stage-grad); cursor:pointer}
.p-media svg{width:66%; height:auto}
.p-badge{position:absolute; top:10px; left:10px; background:var(--sale); color:#fff; font-family:"Outfit";
  font-weight:700; font-size:.68rem; letter-spacing:.06em; padding:.25rem .5rem; border-radius:7px}
.p-tag{position:absolute; top:10px; right:10px; background:var(--surface); color:var(--fg-faint); border:1px solid var(--line);
  font-size:.62rem; font-weight:600; padding:.2rem .45rem; border-radius:6px; letter-spacing:.04em}
.p-body{padding:14px 15px 16px; display:flex; flex-direction:column; gap:.2rem; flex:1}
.p-cat{font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; color:var(--fg-faint); font-weight:600}
.p-name{font-family:"Outfit"; font-weight:700; font-size:1.02rem}
.p-price{margin-top:.1rem; font-weight:700; color:var(--fg)}
.p-price .was{color:var(--fg-faint); text-decoration:line-through; font-weight:500; margin-right:.4rem}
.p-price .mock{font-size:.68rem; color:var(--fg-faint); font-weight:600; margin-left:.3rem}
.p-actions{margin-top:12px; display:flex; gap:.5rem}
.p-actions .btn{flex:1}

/* ---------- Customizer ---------- */
.customizer{display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start}
.cz-controls{display:flex; flex-direction:column; gap:20px}
.field label{display:block; font-family:"Outfit"; font-weight:600; font-size:.82rem; margin-bottom:.4rem; color:var(--fg-soft)}
.field input, .field select{width:100%; padding:.7rem .85rem; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--fg); font-family:inherit; font-size:1rem}
.seg{display:flex; gap:.4rem; flex-wrap:wrap}
.seg button{flex:1; min-width:52px; padding:.6rem 0; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--fg-soft); font-family:"Outfit"; font-weight:700; cursor:pointer; transition:all .15s}
.seg button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.row2{display:grid; grid-template-columns:1fr 100px; gap:14px}
.cz-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm)}

/* ---------- Team kits / bulk ---------- */
.kit-hero{background:linear-gradient(135deg, var(--accent-soft), transparent); border:1px solid var(--line);
  border-radius:24px; padding:30px; display:grid; grid-template-columns:1.2fr 1fr; gap:28px; align-items:center}
.tiers{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:4px}
.tier{border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; background:var(--surface); cursor:pointer; transition:all .15s; text-align:left}
.tier.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.tier b{font-family:"Outfit"; font-size:1.3rem; display:block}
.tier span{font-size:.78rem; color:var(--fg-faint)}
.logo-drop{border:2px dashed var(--line); border-radius:var(--radius-sm); padding:20px; text-align:center;
  background:var(--surface); cursor:pointer; transition:border-color .2s}
.logo-drop:hover{border-color:var(--accent)}
.logo-drop img{width:72px; height:72px; object-fit:contain; border-radius:10px}
.logo-drop input{display:none}

/* ---------- Hub ---------- */
.hub-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px}
.post{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column}
.post-top{aspect-ratio:16/9; background:var(--stage-grad); display:grid; place-items:center; position:relative}
.post-top .k{font-family:"Anton"; font-size:2.4rem; letter-spacing:.02em; color:var(--accent); opacity:.85}
.post-tag{position:absolute; top:10px; left:10px; background:var(--surface); border:1px solid var(--line); border-radius:7px;
  font-family:"Outfit"; font-weight:700; font-size:.66rem; letter-spacing:.06em; padding:.25rem .5rem; text-transform:uppercase}
.post-body{padding:16px; display:flex; flex-direction:column; gap:.4rem; flex:1}
.post-body h3{font-size:1.05rem}
.post-date{font-size:.74rem; color:var(--fg-faint); font-weight:600}
.ig-cta{display:flex; align-items:center; gap:.9rem; margin-top:26px; padding:18px 20px; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow-sm); flex-wrap:wrap}
.ig-badge{width:46px; height:46px; border-radius:13px; display:grid; place-items:center; color:#fff;
  background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}

/* ---------- Cart drawer ---------- */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:80; opacity:0; pointer-events:none; transition:opacity .25s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; height:100%; width:min(420px,100%); z-index:90; background:var(--drawer-bg);
  backdrop-filter:var(--nav-blur); -webkit-backdrop-filter:var(--nav-blur);
  border-left:1px solid var(--line); box-shadow:-20px 0 60px rgba(0,0,0,.2);
  transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.1,1); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex; align-items:center; justify-content:space-between; padding:20px; border-bottom:1px solid var(--line)}
.drawer-head h3{font-family:"Outfit"; font-size:1.2rem}
.drawer-body{flex:1; overflow-y:auto; padding:8px 20px}
.citem{display:grid; grid-template-columns:58px 1fr auto; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center}
.citem .thumb{width:58px; height:58px; border-radius:10px; background:var(--stage-grad); display:grid; place-items:center; border:1px solid var(--line)}
.citem .thumb svg{width:74%}
.citem .ci-name{font-family:"Outfit"; font-weight:700; font-size:.95rem}
.citem .ci-meta{font-size:.76rem; color:var(--fg-faint)}
.qty{display:inline-flex; align-items:center; gap:.5rem; margin-top:.3rem}
.qty button{width:24px; height:24px; border-radius:7px; border:1px solid var(--line); background:var(--surface); color:var(--fg); cursor:pointer; font-weight:700; line-height:1}
.ci-price{font-weight:700; text-align:right}
.ci-remove{background:none; border:0; color:var(--fg-faint); cursor:pointer; font-size:.74rem; margin-top:.3rem; padding:0}
.ci-remove:hover{color:var(--sale)}
.cart-empty{text-align:center; color:var(--fg-faint); padding:50px 10px}
.drawer-foot{padding:18px 20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:12px}
.subtotal{display:flex; justify-content:space-between; font-family:"Outfit"; font-weight:700; font-size:1.1rem}
.subtotal .mock{font-size:.7rem; color:var(--fg-faint); font-weight:600}

/* ---------- Checkout ---------- */
.checkout{display:grid; grid-template-columns:1.3fr 1fr; gap:30px; align-items:start}
.co-form{display:flex; flex-direction:column; gap:16px}
.co-summary{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm); position:sticky; top:90px}
.co-line{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:.92rem}
.co-line:last-of-type{border-bottom:0}
.done-card{max-width:520px; margin:40px auto; text-align:center; background:var(--card); border:1px solid var(--line);
  border-radius:24px; padding:44px 30px; box-shadow:var(--shadow)}
.done-check{width:68px; height:68px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin:0 auto 18px}
.done-check svg{width:34px;height:34px}

/* ---------- Footer / mockup ribbon ---------- */
.mock-ribbon{display:inline-flex; align-items:center; gap:.4rem; background:var(--accent-soft); color:var(--accent);
  border:1px solid var(--accent); font-family:"Outfit"; font-weight:700; font-size:.72rem; letter-spacing:.04em;
  padding:.3rem .7rem; border-radius:999px}

function jerseySVG(cw, opts={}){
  const c = COLORWAYS[cw] || COLORWAYS[0];
  const back = !!opts.back;
  const silhouette = !!opts.silhouette;
  const name = (opts.name||'').toUpperCase();
  const number = (opts.number||'').toString();

    <path d="M200,72 L232,128 L208,140 L184,92 Z" fill="${c.sleeve}"/>
    <path d="M94,135 L90,150 L116,150 L118,120 Z" fill="${c.trim}" opacity=".9"/>
    <path d="M206,135 L210,150 L184,150 L182,120 Z" fill="${c.trim}" opacity=".9"/>`;

  const hem = silhouette ? '' : `<rect x="92" y="300" width="116" height="10" fill="${c.trim}" opacity=".85"/>`;
  let detail = '';
  if(!silhouette){
    if(back){
      detail = `
        <text x="150" y="120" text-anchor="middle" font-family="Anton, sans-serif" font-size="20" letter-spacing="1" fill="${c.num}">${escapeXML(name||'')}</text>
        <text x="150" y="235" text-anchor="middle" font-family="Anton, sans-serif" font-size="110" fill="${c.num}">${escapeXML(number||'')}</text>`;
    } else {

        <path d="M135,66 Q150,86 165,66" fill="none" stroke="${c.trim}" stroke-width="5"/>
        <circle cx="120" cy="120" r="12" fill="none" stroke="${c.trim}" stroke-width="3"/>
        <path d="M120,112 l0,16 M112,120 l16,0" stroke="${c.trim}" stroke-width="2.5"/>`;
    }
  }
  return `<svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${bodyPath}${sleeves}${hem}${detail}

}
function escapeXML(s){return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&#39;','"':'&quot;'}[c]));}

class Jersey{
  constructor(el, opts){
    this.el = el; this.cw = opts.cw||0; this.name=opts.name||''; this.number=opts.number||'';
    this.angle = -18; this.draggable = opts.draggable!==false;
    this.render(); if(this.draggable) this.bindDrag();
  }
  render(){
    const depth = 46, layers = 7;
    let slabs = '';
    for(let i=0;i<layers;i++){
      const z = -depth/2 + (depth)*(i/(layers-1));
      slabs += `<div class="layer" style="transform:translateZ(${z}px)">${jerseySVG(this.cw,{silhouette:true})}</div>`;
    }
    this.el.classList.add('stage');
    this.el.innerHTML = `<div class="rot">
      ${slabs}
      <div class="layer detail" style="transform:translateZ(${depth/2+0.5}px)">${jerseySVG(this.cw,{back:false})}</div>
      <div class="layer detail" style="transform:rotateY(180deg) translateZ(${depth/2+0.5}px)">${jerseySVG(this.cw,{back:true,name:this.name,number:this.number})}</div>
    </div>`;
    this.rot = this.el.querySelector('.rot');
    this.apply();
  }
  apply(){ this.rot.style.transform = `rotateY(${this.angle}deg)`; }
  setColor(cw){ this.cw=cw; this.render(); }
  setText(name,number){ this.name=name; this.number=number; this.render(); }
  bindDrag(){
    let startX=0, startAngle=0, dragging=false;
    const down = (e)=>{ dragging=true; this.el.classList.add('dragging'); startX=(e.touches?e.touches[0].clientX:e.clientX); startAngle=this.angle; e.preventDefault(); };
    const move = (e)=>{ if(!dragging) return; const x=(e.touches?e.touches[0].clientX:e.clientX); this.angle=startAngle+(x-startX)*0.6; this.apply(); };
    const up = ()=>{ dragging=false; this.el.classList.remove('dragging'); };
    this.el.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
    this.el.addEventListener('touchstart',down,{passive:false}); this.el.addEventListener('touchmove',move,{passive:false}); this.el.addEventListener('touchend',up);
  }
}

/* Wire the real 3D GLB jersey (model-viewer) + colorway switching + fallback */
function wireHeroModel(){
  const stage = document.getElementById('heroStage');
  const mv = document.getElementById('heroModel');
  if(!stage || !mv) return;

  const markOk = ()=>{ stage.classList.add('model-ok'); stage.classList.remove('model-failed'); };
  const markFail = ()=>{ stage.classList.add('model-failed'); stage.classList.remove('model-ok'); };

  let settleTimer = null;
  const resetState = ()=>{
    stage.classList.remove('model-ok','model-failed');
    clearTimeout(settleTimer);
    // If model-viewer never upgrades (CDN blocked) or the GLB stalls, reveal
    // the "unavailable" note so the hero explains itself instead of stalling.
    settleTimer = setTimeout(()=>{
      if(!stage.classList.contains('model-ok')) markFail();
    }, 9000);
  };

  mv.addEventListener('load', ()=>{ clearTimeout(settleTimer); markOk(); });
  mv.addEventListener('error', ()=>{ clearTimeout(settleTimer); markFail(); });
  resetState();

  document.querySelectorAll('.stage-wrap .dot').forEach(d=>d.addEventListener('click',()=>{
    const i = +d.dataset.cw;
    heroModelIdx = i;
    const m = HERO_MODELS[i];
    mv.setAttribute('src', m.src);
    mv.setAttribute('alt', 'Draggable 3D jersey — ' + m.label);
    resetState();
    document.querySelectorAll('.stage-wrap .dot').forEach(x=>x.setAttribute('aria-pressed', x===d));
  }));
}

/* ============================================================
   Cart
   ============================================================ */
function cartLabel(it){
  if(it.custom) return it.name + (it.number&&it.number!=='—'&&it.number!==''? ' · '+it.number : '') ;
  return it.name;
}
function cartTotal(){ return cart.reduce((s,it)=> s + (it.price==null?0:it.price*it.qty), 0); }
function saveCart(){ try{ localStorage.setItem('jb_cart', JSON.stringify(cart)); }catch(e){} }
function addToCart(item){
  const key = item.id;
  const existing = cart.find(c=>c.id===key);
  if(existing && !item.custom){ existing.qty++; }
  else { cart.push(Object.assign({qty:1}, item)); }
  saveCart(); updateCart();
}
function addProduct(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return;
  addToCart({ id:p.id, name:pname(p), price:p.price, cw:p.cw, size:'M', pname:'', number:'' });
  toast(t('added'));
}
function updateCart(){
  const n = cart.reduce((s,i)=>s+i.qty,0);
  const badge=document.getElementById('cartCount');
  badge.textContent=n; badge.setAttribute('data-empty', n===0);
  const body=document.getElementById('cartBody'), foot=document.getElementById('cartFoot');
  if(cart.length===0){
    body.innerHTML=`<div class="cart-empty"><p>${t('cart_empty')}</p><button class="btn btn-ghost btn-sm" data-nav="soccer" style="margin-top:14px">${t('cart_empty_cta')}</button></div>`;
    foot.innerHTML='';
  } else {
    body.innerHTML = cart.map((it,idx)=>`<div class="citem">
      <div class="thumb">${jerseySVG(it.cw||0,{back:false})}</div>
      <div>
        <div class="ci-name">${cartLabel(it)}</div>
        <div class="ci-meta">${it.pname?it.pname+' · ':''}${t('size_label')} ${it.size}${(it.number&&!it.quote)?' · '+t('number_label')+' '+it.number:''}</div>
        ${it.quote?'':`<div class="qty"><button data-dec="${idx}" aria-label="decrease">−</button><span class="tnum">${it.qty}</span><button data-inc="${idx}" aria-label="increase">+</button></div>`}
        <button class="ci-remove" data-rm="${idx}">${t('remove')}</button>
      </div>
      <div class="ci-price tnum">${it.price==null?'<span class="faint" style="font-size:.78rem">'+(lang==='es'?'Cotizar':'Quote')+'</span>':'$'+(it.price*it.qty)}</div>
    </div>`).join('');
    foot.innerHTML = `<div class="subtotal"><span data-i18n="subtotal">${t('subtotal')}</span><span class="tnum">$${cartTotal()} <span class="mock">(mock)</span></span></div>
      <button class="btn btn-primary btn-block" id="goCheckout">${t('checkout')}</button>`;
    document.getElementById('goCheckout').addEventListener('click',()=>{ closeCart(); navigate('checkout'); });
  }
  body.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{ closeCart(); navigate(b.dataset.nav); }));
  body.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ cart.splice(+b.dataset.rm,1); saveCart(); updateCart(); }));
  body.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click',()=>{ cart[+b.dataset.inc].qty++; saveCart(); updateCart(); }));
  body.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.dec; cart[i].qty--; if(cart[i].qty<=0)cart.splice(i,1); saveCart(); updateCart(); }));
}
function openCart(){ document.getElementById('scrim').classList.add('open'); document.getElementById('drawer').classList.add('open'); document.getElementById('drawer').setAttribute('aria-hidden','false'); }
function closeCart(){ document.getElementById('scrim').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer').setAttribute('aria-hidden','true'); }

/* ============================================================
   Hub
   ============================================================ */
function renderHub(){
  const posts=[1,2,3,4];
  app.innerHTML=`<section class="view wrap">
    <div class="sec-head"><div><span class="eyebrow" data-i18n="hub_eyebrow"></span><h2 data-i18n="hub_title" style="margin-top:.4rem"></h2><p data-i18n="hub_sub"></p></div></div>
    <div class="hub-grid">
      ${posts.map(i=>`<article class="post">
        <div class="post-top"><span class="k">JB</span><span class="post-tag" data-i18n="post${i}_tag"></span></div>
        <div class="post-body">
          <span class="post-date" data-i18n="date${i}"></span>
          <h3 data-i18n="post${i}_t"></h3>
          <p class="muted" style="font-size:.9rem" data-i18n="post${i}_d"></p>
          <a href="https://instagram.com/jerseys_barato" target="_blank" rel="noopener" style="color:var(--accent); font-weight:600; font-size:.86rem; text-decoration:none; margin-top:auto" data-i18n="read"></a>
        </div>
      </article>`).join('')}
    </div>
    <a class="ig-cta" href="https://instagram.com/jerseys_barato" target="_blank" rel="noopener" style="text-decoration:none">
      <span class="ig-badge"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg></span>
      <div style="flex:1; min-width:0"><div style="font-family:'Outfit'; font-weight:700" data-i18n="ig_title"></div><div class="muted" style="font-size:.86rem" data-i18n="ig_sub"></div></div>
      <span class="btn btn-primary btn-sm" data-i18n="ig_cta"></span>
    </a>
  </section>`;
  afterRender();
}

/* ============================================================
   Router / shared
   ============================================================ */
const ROUTES = {
  home:renderHome, soccer:()=>renderCategory('soccer'), basketball:()=>renderCategory('basketball'),
  football:()=>renderCategory('football'), sale:renderSale, customizer:renderCustomizer,
  kits:renderKits, hub:renderHub, checkout:renderCheckout
};
let current='home';
function navigate(view){
  if(!ROUTES[view]) view='home';
  current=view;
  (ROUTES[view])();
  window.scrollTo({top:0, behavior:'instant'in document.documentElement.style?'instant':'auto'});
  document.querySelectorAll('.nav-links button').forEach(b=>b.classList.toggle('active', b.dataset.nav===view));
  document.getElementById('navLinks').classList.remove('open');
}
function afterRender(){
  applyI18n(app);
  app.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click',()=> navigate(b.dataset.nav)));
  app.querySelectorAll('[data-add]').forEach(b=> b.addEventListener('click',(e)=>{ e.stopPropagation(); addProduct(b.dataset.add); }));
  app.querySelectorAll('[data-customize]').forEach(b=> b.addEventListener('click',(e)=>{ e.stopPropagation(); navigate('customizer'); }));
}
function applyI18n(root){
  (root||document).querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
}

/* ============================================================
   Toast
   ============================================================ */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1700);
}

/* ============================================================
   Theme + language + global controls
   ============================================================ */
function applyTheme(){ document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('jb_theme',theme); }
function cycleTheme(){ theme = THEMES[(THEMES.indexOf(theme)+1)%THEMES.length]; applyTheme(); }
function applyLangUI(){
  document.documentElement.setAttribute('lang', lang);
  document.querySelector('#langBtn .en').classList.toggle('on', lang==='en');
  document.querySelector('#langBtn .es').classList.toggle('on', lang==='es');
  applyI18n(document);
}
function setLang(l){ lang=l; localStorage.setItem('jb_lang',l); applyLangUI(); (ROUTES[current])(); afterRenderPostLang(); updateCart(); }
function afterRenderPostLang(){ document.querySelectorAll('.nav-links button').forEach(b=>b.classList.toggle('active', b.dataset.nav===current)); }

document.getElementById('themeBtn').addEventListener('click',cycleTheme);
document.getElementById('langBtn').addEventListener('click',()=> setLang(lang==='en'?'es':'en'));
document.getElementById('cartBtn').addEventListener('click',openCart);
document.getElementById('closeCart').addEventListener('click',closeCart);
document.getElementById('scrim').addEventListener('click',closeCart);
document.getElementById('dealBanner').addEventListener('click',()=> navigate('sale'));
document.getElementById('hamburger').addEventListener('click',()=> document.getElementById('navLinks').classList.toggle('open'));
document.querySelectorAll('.nav-links button, .brand').forEach(b=> b.addEventListener('click',()=> b.dataset.nav && navigate(b.dataset.nav)));
document.querySelectorAll('.site-foot [data-nav]').forEach(b=> b.addEventListener('click',()=> navigate(b.dataset.nav)));
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCart(); });

/* ---- Boot ---- */
applyTheme();
applyLangUI();
navigate('home');
updateCart();
</script>
</body>
</html>
